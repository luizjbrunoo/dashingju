<span class="rounded-md border px-2 py-0.5 text-[10px] font-medium
    {% if tarefa.status == 'pendente' %}border-zinc-700 bg-zinc-950/60 text-zinc-300
    {% elif tarefa.status == 'em_andamento' %}border-bally/30 bg-bally-muted/20 text-bally-bright
    {% elif tarefa.status == 'concluida' %}border-emerald-900/40 bg-emerald-950/30 text-emerald-300
    {% elif tarefa.status == 'cancelada' %}border-red-900/40 bg-red-950/30 text-red-400
    {% else %}border-zinc-700 bg-zinc-950/60 text-zinc-400{% endif %}">
    {{ tarefa.get_status_display }}
</span>
