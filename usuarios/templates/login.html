{% extends 'base.html' %}

{% block 'body' %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm rounded-xl border border-zinc-800 bg-zinc-900/80 p-6 shadow-lg shadow-bally/5 ring-1 ring-bally/10 backdrop-blur-sm">
        <div class="flex items-center justify-center">
            <p class="text-sm font-semibold text-zinc-100">
                ADV Growth 90
                <span class="ml-1.5 inline-block h-1.5 w-1.5 rounded-full bg-bally" aria-hidden="true"></span>
            </p>
        </div>
        <h2 class="mt-6 text-xl font-semibold text-zinc-100 text-center">Entrar</h2>

        {% if messages %}
            <div class="mt-4 space-y-2">
                {% for message in messages %}
                    <div class="rounded-md {{ message.tags }} px-3 py-2 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST" class="mt-6 space-y-4">
            {% csrf_token %}
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}" />
            {% endif %}
            <div>
                <label for="username" class="block text-sm font-medium text-zinc-300">Username</label>
                <input id="username" name="username" type="text" required
                       class="mt-1 block w-full rounded-md border border-zinc-700 bg-zinc-950/50 px-3 py-2 text-zinc-100 placeholder:text-zinc-500 focus:border-bally-bright focus:outline focus:outline-2 focus:outline-offset-0 focus:outline-bally/50" />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-zinc-300">Senha</label>
                <input id="password" name="password" type="password" required
                       class="mt-1 block w-full rounded-md border border-zinc-700 bg-zinc-950/50 px-3 py-2 text-zinc-100 placeholder:text-zinc-500 focus:border-bally-bright focus:outline focus:outline-2 focus:outline-offset-0 focus:outline-bally/50" />
            </div>
            <button type="submit"
                    class="w-full rounded-md bg-bally px-3 py-2 text-sm font-semibold text-white shadow-sm shadow-bally/20 hover:bg-bally-bright">
                Entrar
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-zinc-500">
            Ainda não tem conta?
            <a href="{% url 'cadastro' %}" class="font-medium text-bally-bright hover:text-bally hover:underline">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock 'body' %}
