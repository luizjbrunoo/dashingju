{% extends "base.html" %}
{% load static %}
{% block 'body' %}
    <main>
        <header class="relative isolate border-b border-zinc-800/80 bg-linear-to-r from-bally-muted/50 via-zinc-900/80 to-zinc-950">
            <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
                <div class="mx-auto flex max-w-2xl items-center justify-between gap-x-8 lg:mx-0 lg:max-w-none">
                    <div class="flex min-w-0 flex-1 items-center gap-x-4">
                        <a
                            href="{% url 'cliente' cliente.id %}"
                            class="shrink-0 rounded-lg border border-zinc-600 bg-zinc-900/80 px-3 py-2 text-sm font-medium text-zinc-200 transition-colors hover:border-bally/50 hover:bg-zinc-800 hover:text-bally-bright"
                        >
                            Voltar
                        </a>
                        <h1 class="min-w-0">
                            <div class="mt-1 truncate text-base font-semibold text-zinc-100">{{ cliente.nome }}</div>
                        </h1>
                    </div>
                </div>
            </div>
        </header>
        <div class="px-4 md:px-0">
            <div class="mx-auto mt-8 max-w-4xl rounded-md border border-zinc-800/80 bg-zinc-900/40 px-4 py-16 sm:px-6 lg:px-8">
                <!-- Container principal empilhando tudo -->
                <div class="flex flex-col gap-6" id="chat">
                    <!-- Mensagem do assistente -->
                    <div class="flex items-start gap-2.5">
                        <img class="w-12 h-12 rounded-full"
                             src="{% static 'Imagem_EcildaII.jpg' %}">
                        <div class="flex flex-col gap-1 w-full max-w-[320px]">
                            <div class="flex items-center space-x-2 rtl:space-x-reverse">
                                <span class="text-sm font-semibold text-bally-bright">PsiQuete</span>
                                <span class="text-sm font-normal text-zinc-500">11:46</span>
                            </div>
                            <div class="flex flex-col leading-1.5 p-4 rounded-e-xl rounded-es-xl border border-zinc-700/80 bg-zinc-800/80">
                                <p class="text-sm font-normal py-2.5 text-zinc-200">Olá, eu sou sua assistente virtual. Como posso ajudar?</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="px-4 md:px-0">
            <div class="mx-auto mt-6 max-w-4xl rounded-md border border-zinc-800/80 bg-zinc-900/40 px-4 py-4 sm:px-6 lg:px-8">
                <form id="form-pergunta">
                    <div class="flex items-center gap-4">
                        <input type="text"
                               name="pergunta"
                               id="pergunta"
                               placeholder="Digite sua pergunta..."
                               class="flex-1 rounded-md border border-zinc-700 bg-zinc-950/50 px-4 py-2 text-sm text-zinc-100 placeholder:text-zinc-500">
                        <button type="submit"
                                class="cursor-pointer rounded-md bg-bally px-3 py-2 text-sm font-semibold text-white shadow-md shadow-bally/20 hover:bg-bally-bright focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-bally">
                            Enviar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('form-pergunta').addEventListener('submit', async function(event){
            event.preventDefault();
            const pergunta = document.getElementById('pergunta').value
            const formData = new FormData();
            formData.append('pergunta', pergunta)
            const response = await fetch("", {
                method: "POST",
                body: formData
            })
            const data = await response.json()
            const perguntaId = data.id

            const novaMensagem1 = document.createElement("div");
            novaMensagem1.className = "flex items-start gap-2.5 justify-end";
            novaMensagem1.innerHTML = `
                <div class="flex flex-col gap-1 w-full max-w-[320px] text-right">
                    <div class="flex items-center justify-end space-x-2 rtl:space-x-reverse">
                    <span class="text-sm font-normal text-zinc-500">11:46</span>
                    <span class="text-sm font-semibold text-bally-bright">Você</span>
                    </div>
                        <div class="flex flex-col leading-1.5 p-4 rounded-s-xl rounded-ee-xl border border-bally/30 bg-bally/25 text-zinc-100">
                        <p class="text-sm font-normal py-2.5">
                            ${pergunta}
                        </p>
                    </div>
                </div>`;

            document.getElementById("chat").appendChild(novaMensagem1);

            const novaMensagem = document.createElement("div");
            novaMensagem.className = "flex items-start gap-2.5";

            novaMensagem.innerHTML = `
                <img class="w-12 h-12 rounded-full" src="{% static 'logo_dashing_juridico.jpg' %}" alt="Pythonete">
                <div class="flex flex-col gap-1 w-full max-w-[320px]">
                    <div class="flex items-center space-x-2 rtl:space-x-reverse">
                        <span class="text-sm font-semibold text-bally-bright">PsiQuete</span>
                        <span class="text-sm font-normal text-zinc-500">10:00</span>
                    </div>
                    <div class="flex flex-col leading-1.5 p-4 rounded-e-xl rounded-es-xl border border-zinc-700/80 bg-zinc-800/80">
                        <p id="resposta-pythonete-${perguntaId}" class="text-sm font-normal py-2.5 text-zinc-200"></p>
                    </div>
                   <a href="/ia/ver_referencias/${perguntaId}" class="text-sm font-normal text-bally-bright/90 hover:text-bally-bright">Confira as fontes</a>
                </div>
            `;

            document.getElementById("chat").appendChild(novaMensagem);

            const streamResponse = await fetch("{% url 'stream_resposta' %}",{
                method: "POST",
                headers: {
                     "Content-Type": "application/x-www-form-urlencoded",
                },
                body: new URLSearchParams({id_pergunta: perguntaId})
            });

            const reader = streamResponse.body.getReader()
            const decoder = new TextDecoder("utf-8")
            const respostaElemento = document.getElementById(`resposta-pythonete-${perguntaId}`)

            while (true){
                const {done, value} = await reader.read()
                if (done) break;

                console.log(value)
                const chunk = decoder.decode(value, { stream: true})
                respostaElemento.innerText += chunk

            }
        })

    </script>
{% endblock 'body' %}
