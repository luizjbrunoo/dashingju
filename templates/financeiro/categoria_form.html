{% extends 'base.html' %}
{% block 'body' %}
<div class="app-shell py-8">
    <div class="max-w-xl">
    {% include 'financeiro/_mensagens.html' %}
    {% include 'financeiro/_subnav.html' %}

    <h1 class="text-xl font-semibold text-zinc-100">{{ titulo }}</h1>

    <form method="post" class="mt-8 space-y-5">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="mb-1 block text-sm font-medium text-zinc-400" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="mt-1 text-sm text-red-400">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <div class="flex gap-3 pt-4">
            <button type="submit" class="rounded-md bg-bally px-4 py-2 text-sm font-semibold text-white hover:bg-bally-bright">Salvar</button>
            <a href="{% url 'financeiro_categoria_listar' %}" class="rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Cancelar</a>
        </div>
    </form>
    </div>
</div>
{% endblock 'body' %}
