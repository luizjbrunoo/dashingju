{% extends 'base.html' %}
{% block 'body' %}
<div class="app-shell py-8">
    <div class="max-w-lg">
    {% include 'financeiro/_mensagens.html' %}
    {% include 'financeiro/_subnav.html' %}

    <h1 class="text-xl font-semibold text-zinc-100">Excluir banco</h1>
    <p class="mt-4 text-sm text-zinc-400">
        Confirma a exclusão de <strong class="text-zinc-200">{{ banco.nome }}</strong>? Os lançamentos vinculados também serão removidos.
    </p>

    <form method="post" class="mt-8 flex gap-3">
        {% csrf_token %}
        <button type="submit" class="rounded-md bg-red-900/80 px-4 py-2 text-sm font-semibold text-red-100 hover:bg-red-800">Excluir</button>
        <a href="{% url 'financeiro_banco_listar' %}" class="rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-300 hover:bg-zinc-800">Cancelar</a>
    </form>
    </div>
</div>
{% endblock 'body' %}
