<!DOCTYPE html>
<html lang="pt-BR" class="h-full" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ADV Growth 90</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme {
                --color-bally: #1b5c47;
                --color-bally-bright: #2d8f6e;
                --color-bally-muted: #134a3a;
            }
            @utility app-shell {
                margin-inline: auto;
                width: 100%;
                max-width: 100rem;
                padding-inline: clamp(1rem, 2.5vw, 2.5rem);
            }
        </style>
        {% block 'head' %}
        {% endblock 'head' %}
    </head>
    <body class="min-h-screen w-full overflow-x-hidden bg-zinc-950 text-zinc-200 antialiased">
        <header class="border-b border-zinc-800/80 bg-zinc-900/90 backdrop-blur-sm">
            <div class="app-shell flex items-center justify-between py-3">
                <a href="/" class="text-sm font-semibold text-zinc-100">
                    ADV Growth 90
                    <span class="ml-1.5 inline-block h-1.5 w-1.5 rounded-full bg-bally" aria-hidden="true"></span>
                </a>
                {% if request.user.is_authenticated %}
                    <div class="flex flex-wrap items-center gap-3 text-sm text-zinc-400">
                        <span>
                            Usuario logado:
                            <span class="font-semibold text-bally-bright">{{ request.user.username }}</span>
                        </span>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button
                                type="submit"
                                class="rounded-md border border-zinc-700 bg-zinc-900/50 px-3 py-1 text-xs font-semibold text-zinc-200 hover:border-bally/50 hover:bg-bally-muted/30 hover:text-bally-bright"
                            >
                                Sair
                            </button>
                        </form>
                    </div>
                {% endif %}
            </div>
        </header>
        {% block 'body' %}
        {% endblock 'body' %}
    </body>
</html>
